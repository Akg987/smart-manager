services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  migrate:
    build:
      context: .
      target: migrate
      args:
        NEST_API_URL: http://api:4000
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      APP_KEY: ${APP_KEY:?Set the existing Laravel APP_KEY}
      TWO_FACTOR_ENABLED: ${TWO_FACTOR_ENABLED:-false}
      TWO_FACTOR_ROLES: ${TWO_FACTOR_ROLES:-admin}
      TWO_FACTOR_FAIL_OPEN: ${TWO_FACTOR_FAIL_OPEN:-false}
      IPPANEL_OTP_PATTERN_CODE: ${IPPANEL_OTP_PATTERN_CODE:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/auth/me').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [private]

  web:
    build:
      context: .
      target: web
      args:
        NEST_API_URL: http://api:4000
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      NEST_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [private]

volumes:
  postgres_data:
  uploads:

networks:
  private:
    internal: true
